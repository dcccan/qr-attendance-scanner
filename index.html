<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event QR Check-In</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #f4f6f8; 
      padding: 16px; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card { 
      width: 100%; 
      max-width: 480px; 
      background: #ffffff; 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      text-align: center;
    }
    h2 { margin-bottom: 16px; color: #1a1d20; font-size: 1.5rem; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #6c757d; margin-bottom: 6px; }
    input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ced4da; 
      border-radius: 8px; 
      font-size: 1rem; 
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #0d6efd; }
    #reader { 
      width: 100%; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 2px solid #e9ecef;
      margin-bottom: 16px;
    }
    #status { 
      font-weight: 600; 
      padding: 14px; 
      border-radius: 8px; 
      font-size: 1rem; 
      transition: all 0.3s ease;
      line-height: 1.4;
    }
    .ready { background: #e9ecef; color: #495057; }
    .processing { background: #cff4fc; color: #055160; }
    .success { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
    .warning { background: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
    .error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
  </style>
</head>
<body>

<div class="card">
  <h2>Event Check-In</h2>
  
  <div class="input-group">
    <label for="scannerOperator">Scanner Location / Operator</label>
    <input type="text" id="scannerOperator" placeholder="e.g., Gate A / John" value="Gate 1">
  </div>
  
  <div id="reader"></div>
  <div id="status" class="ready">Ready to scan...</div>
</div>

<script>
  // =========================================================================
  // REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
  // =========================================================================
  const WEB_APP_URL = 'YOUR_WEB_APP_URL_HERE';

  let isProcessing = false;

  // Web Audio API synth for audio feedback without needing external MP3 files
  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
        osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.15); // E3
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      }
    } catch (e) {
      // AudioContext fallback for restricted browsers
    }
  }

  async function onScanSuccess(decodedText) {
    // Prevent duplicate triggers while processing a request
    if (isProcessing) return;
    isProcessing = true;

    const statusDiv = document.getElementById('status');
    const operatorInput = document.getElementById('scannerOperator');
    const operator = operatorInput.value.trim() || 'Gate 1';

    statusDiv.className = 'processing';
    statusDiv.innerText = "⏳ Verifying Token...";

    try {
      // Send parameters via URLSearchParams to prevent CORS/header mismatch errors on iOS/Android
      const payload = new URLSearchParams();
      payload.append('id', decodedText.trim());
      payload.append('scannedBy', operator);

      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: payload
      });
      
      const data = await response.json();

      if (data.status === 'ok') {
        playSound('success');
        if (navigator.vibrate) navigator.vibrate(100);
        statusDiv.className = 'success';
        statusDiv.innerHTML = `✅ <strong>CHECKED IN</strong><br>${data.name}<br><small>${data.affiliation || ''}</small>`;
      } else if (data.status === 'duplicate') {
        playSound('error');
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        statusDiv.className = 'warning';
        statusDiv.innerHTML = `⚠️ <strong>ALREADY CHECKED IN</strong><br>${data.name}`;
      } else if (data.status === 'unknown') {
        playSound('error');
        if (navigator.vibrate) navigator.vibrate(300);
        statusDiv.className = 'error';
        statusDiv.innerHTML = `❌ <strong>INVALID QR CODE</strong>`;
      } else {
        playSound('error');
        statusDiv.className = 'error';
        statusDiv.innerText = `Error: ${data.status}`;
      }
    } catch (err) {
      playSound('error');
      statusDiv.className = 'error';
      statusDiv.innerText = 'Network error: ' + err.message;
    } finally {
      // 2.5-second cooldown before resuming the scanner
      setTimeout(() => { 
        isProcessing = false; 
        statusDiv.className = 'ready';
        statusDiv.innerText = "Ready to scan...";
      }, 2500);
    }
  }

  // Initialize camera scanner view
  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", 
    { 
      fps: 10, 
      qrbox: { width: 220, height: 220 },
      rememberLastUsedCamera: true,
      supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    },
    /* verbose= */ false
  );
  
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>

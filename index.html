<script>
  // Active Google Apps Script Web App Endpoint
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwwSDFbpL-XuYwAx2_l1vcF3zIAFo9oGkejaCBg-g-AnVHrGpMn-9ony3B9yItDzWM/exec';
  
  let isProcessing = false;

  // Sound feedback synthesis
  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else if (type === 'warning' || type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    } catch (e) {
      // Audio context blocked or unsupported
    }
  }

  async function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    const statusDiv = document.getElementById('status');
    const operator = document.getElementById('scannerOperator').value || 'C/Can in Quezon City';

    statusDiv.className = 'verifying';
    statusDiv.innerText = "⏳ Verifying Token...";

    try {
      const payload = new URLSearchParams();
      payload.append('id', decodedText.trim());
      payload.append('scannedBy', operator);

      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: payload,
        redirect: 'follow'
      });

      const responseText = await response.text();
      let data;

      try {
        data = JSON.parse(responseText);
      } catch (e) {
        throw new Error('Apps Script permissions error. Make sure "Who has access" is set to "Anyone" and deployed as a New Version.');
      }

      if (data.status === 'ok') {
        statusDiv.className = 'success';
        statusDiv.innerText = `✅ CHECKED IN: ${data.name} (${data.affiliation || 'No Affiliation'})`;
        playSound('success');
      } else if (data.status === 'duplicate') {
        statusDiv.className = 'warning';
        statusDiv.innerText = `⚠️ ALREADY CHECKED IN: ${data.name}`;
        playSound('warning');
      } else if (data.status === 'unknown') {
        statusDiv.className = 'error';
        statusDiv.innerText = `❌ INVALID OR UNKNOWN QR CODE`;
        playSound('error');
      } else {
        statusDiv.className = 'error';
        statusDiv.innerText = `Error: ${data.status}`;
        playSound('error');
      }
    } catch (err) {
      statusDiv.className = 'error';
      statusDiv.innerText = err.message;
      playSound('error');
    } finally {
      setTimeout(() => { 
        isProcessing = false; 
        if (statusDiv.className !== 'ready') {
          statusDiv.className = 'ready';
          statusDiv.innerText = 'Ready to scan...';
        }
      }, 2500);
    }
  }

  // Initialize lower-level Html5Qrcode reader to specify rear camera directly
  const html5QrCode = new Html5Qrcode("reader");

  const config = { 
    fps: 10, 
    qrbox: { width: 250, height: 250 } 
  };

  // Force back camera via { facingMode: "environment" }
  html5QrCode.start(
    { facingMode: "environment" }, 
    config, 
    onScanSuccess
  ).catch(err => {
    console.error("Unable to start scanning with rear camera:", err);
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event QR Check-In Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      text-align: center; 
      padding: 16px; 
      background-color: #f4f6f8; 
      margin: 0;
    }
    .card { 
      max-width: 480px; 
      margin: 0 auto; 
      background: white; 
      padding: 20px; 
      border-radius: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
    }
    h2 { margin-top: 0; color: #1a1a1a; font-size: 1.4rem; }
    input { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 12px; 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      font-size: 15px; 
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #007aff; }
    #reader { 
      width: 100%; 
      margin: 10px 0; 
      border-radius: 12px; 
      overflow: hidden; 
      background: #000;
    }
    #status { 
      font-weight: 600; 
      margin-top: 15px; 
      padding: 14px; 
      border-radius: 8px; 
      font-size: 1rem; 
      transition: all 0.2s ease-in-out;
    }
    .ready { background: #e9ecef; color: #495057; }
    .verifying { background: #cce5ff; color: #004085; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="card">
  <h2>Event Check-In Scanner</h2>
  <input type="text" id="scannerOperator" placeholder="Scanner Operator / Gate (e.g. Gate A)">
  
  <div id="reader"></div>
  <div id="status" class="ready">Ready to scan...</div>
</div>

<script>
  // 1. Paste your Google Apps Script Web App URL below
  const WEB_APP_URL = 'https://script.google.com/a/macros/citycancerchallenge.org/s/AKfycbwwSDFbpL-XuYwAx2_l1vcF3zIAFo9oGkejaCBg-g-AnVHrGpMn-9ony3B9yItDzWM/exec
';
  
  let isProcessing = false;

  // Sound synthesis for scan feedback
  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else if (type === 'warning' || type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    } catch (e) {
      // Audio context blocked or unsupported on device
    }
  }

  async function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    const statusDiv = document.getElementById('status');
    const operator = document.getElementById('scannerOperator').value || 'Gate 1';

    statusDiv.className = 'verifying';
    statusDiv.innerText = "⏳ Verifying Token...";

    try {
      // Use URLSearchParams to ensure iOS/Safari compatibility without CORS/Header string errors
      const payload = new URLSearchParams();
      payload.append('id', decodedText.trim());
      payload.append('scannedBy', operator);

      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        body: payload
      });
      
      const data = await response.json();

      if (data.status === 'ok') {
        statusDiv.className = 'success';
        statusDiv.innerText = `✅ CHECKED IN: ${data.name} (${data.affiliation || 'No Affiliation'})`;
        playSound('success');
      } else if (data.status === 'duplicate') {
        statusDiv.className = 'warning';
        statusDiv.innerText = `⚠️ ALREADY CHECKED IN: ${data.name}`;
        playSound('warning');
      } else if (data.status === 'unknown') {
        statusDiv.className = 'error';
        statusDiv.innerText = `❌ INVALID OR UNKNOWN QR CODE`;
        playSound('error');
      } else {
        statusDiv.className = 'error';
        statusDiv.innerText = `Error: ${data.status}`;
        playSound('error');
      }
    } catch (err) {
      statusDiv.className = 'error';
      statusDiv.innerText = 'Network Error: ' + err.message;
      playSound('error');
    } finally {
      // Throttles subsequent scans for 2.5 seconds to prevent accidental double-scans
      setTimeout(() => { 
        isProcessing = false; 
        if (statusDiv.className !== 'ready') {
          statusDiv.className = 'ready';
          statusDiv.innerText = 'Ready to scan...';
        }
      }, 2500);
    }
  }

  // Initialize Html5QrcodeScanner
  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 10, 
    qrbox: { width: 250, height: 250 },
    aspectRatio: 1.0
  });
  
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
